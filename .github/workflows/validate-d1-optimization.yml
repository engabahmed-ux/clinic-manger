name: Validate D1 read optimization

on:
  push:
    branches:
      - feature/cloudflare-native-data
    paths:
      - "src/**/*.js"
      - "functions/**/*.js"
      - "migrations/**/*.sql"
      - "tests/**/*.py"
      - ".github/workflows/validate-d1-optimization.yml"
  pull_request:
    paths:
      - "src/**/*.js"
      - "functions/**/*.js"
      - "migrations/**/*.sql"
      - "tests/**/*.py"
      - ".github/workflows/validate-d1-optimization.yml"

jobs:
  syntax-and-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          find src functions realtime -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test synthetic API permission matrix
        run: node --experimental-default-type=module --test tests/permission-matrix.test.mjs
      - name: Test D1 query filtering and index plans
        run: python -m unittest discover -s tests -v
