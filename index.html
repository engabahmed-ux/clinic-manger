
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11141A">
  <meta name="description" content="موقع العيادة وحجز المواعيد">
  <title>موقع العيادة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#home" aria-label="الرئيسية">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span class="brand-text">
          <strong data-doctor-name></strong>
          <small data-specialty></small>
        </span>
      </a>

      <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="فتح القائمة"
        aria-expanded="false"
        aria-controls="mainNav"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="main-nav" id="mainNav" aria-label="القائمة الرئيسية">
        <a href="#home" data-nav="home"></a>
        <a href="#about" data-nav="about"></a>
        <a href="#services" data-nav="services"></a>
        <a href="#booking" data-nav="booking"></a>
        <a href="#patient-portal" data-nav="patientPortal"></a>
      </nav>

      <a class="header-cta" href="#booking" data-nav="booking"></a>
    </div>
  </header>

  <main>
    <section class="hero section" id="home">
      <div class="container hero-grid">
        <div class="hero-content">
          <p class="eyebrow">
            <span class="eyebrow-dot"></span>
            <span data-hero="eyebrow"></span>
          </p>

          <h1>
            <span data-hero="titleLine1"></span>
            <span class="highlight" data-hero="highlightedTitle"></span>
            <span data-hero="titleLine2"></span>
          </h1>

          <p class="hero-description" data-hero="description"></p>

          <div class="hero-actions">
            <a class="button button-primary" href="#booking" data-hero="primaryButton"></a>
            <a class="button button-outline" href="#services" data-hero="secondaryButton"></a>
          </div>

          <p class="hero-note" data-hero="note"></p>

          <div class="hero-highlights" id="heroHighlights"></div>
        </div>

        <div class="hero-visual">
          <div class="visual-main">
            <div class="visual-topline">
              <span class="visual-symbol">✳</span>
              <span data-hero="visualLabel"></span>
            </div>

            <div class="doctor-image-wrap" id="doctorImageWrap">
              <div class="doctor-image-placeholder" id="doctorImagePlaceholder">
                <span class="placeholder-plus">✳</span>
                <span data-hero="cardLabel"></span>
              </div>
              <img id="doctorImage" alt="" hidden>
            </div>

            <div class="visual-caption">
              <span class="caption-indicator"></span>
              <span data-hero="cardFooter"></span>
            </div>
          </div>

          <div class="floating-card">
            <span class="floating-icon">✳</span>
            <div>
              <strong data-hero="floatingTitle"></strong>
              <p data-hero="floatingDescription"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="highlights-strip">
      <div class="container highlights-grid" id="highlightsGrid"></div>
    </section>

    <section class="section about-section" id="about">
      <div class="container about-grid">
        <div class="section-intro">
          <p class="section-label" data-about="sectionLabel"></p>
          <h2>
            <span data-about="title"></span>
            <span class="highlight" data-about="highlightedTitle"></span>
            <span data-about="titleEnd"></span>
          </h2>
        </div>

        <div class="about-copy">
          <div id="aboutParagraphs"></div>
          <a class="button button-dark" href="#booking" data-about="button"></a>
        </div>
      </div>
    </section>

    <section class="section services-section" id="services">
      <div class="container">
        <div class="section-heading">
          <p class="section-label" data-services="sectionLabel"></p>
          <h2>
            <span data-services="title"></span>
            <span class="highlight" data-services="highlightedTitle"></span>
          </h2>
          <p data-services="description"></p>
        </div>

        <div class="services-grid" id="servicesGrid"></div>
      </div>
    </section>

    <section class="section booking-section" id="booking">
      <div class="container booking-grid">
        <div class="booking-intro">
          <p class="section-label" data-booking="sectionLabel"></p>
          <h2>
            <span data-booking="title"></span>
            <span class="highlight" data-booking="highlightedTitle"></span>
          </h2>
          <p data-booking="description"></p>

          <div class="booking-contact">
            <div class="contact-icon">☎</div>
            <div>
              <span data-contact="phoneLabel"></span>
              <a id="bookingPhone" href="#"></a>
            </div>
          </div>
        </div>

        <div class="form-panel">
          <h3 data-booking="panelTitle"></h3>
          <p class="form-description" data-booking="panelDescription"></p>

          <form id="bookingForm">
            <div class="form-field">
              <label for="patientName" data-booking="patientNameLabel"></label>
              <input
                id="patientName"
                name="patientName"
                type="text"
                autocomplete="name"
                required
              >
            </div>

            <div class="form-field">
              <label for="patientPhone" data-booking="patientPhoneLabel"></label>
              <input
                id="patientPhone"
                name="patientPhone"
                type="tel"
                inputmode="tel"
                autocomplete="tel"
                required
              >
            </div>

            <div class="form-field">
              <label for="appointmentDate" data-booking="appointmentDateLabel"></label>
              <input
                id="appointmentDate"
                name="appointmentDate"
                type="date"
                required
              >
            </div>

            <button class="button button-primary form-submit" type="submit" data-booking="submitButton"></button>

            <p class="form-disclaimer" data-booking="disclaimer"></p>
            <p class="form-message" id="bookingMessage" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>

    <section class="section portal-section" id="patient-portal">
      <div class="container portal-grid">
        <div class="portal-intro">
          <p class="section-label" data-portal="sectionLabel"></p>
          <h2>
            <span data-portal="title"></span>
            <span class="highlight" data-portal="highlightedTitle"></span>
          </h2>
          <p data-portal="description"></p>
        </div>

        <div class="portal-panel">
          <div class="portal-icon">↗</div>
          <h3 data-portal="loginTitle"></h3>
          <p data-portal="demoMessage"></p>

          <form id="patientLoginForm">
            <div class="form-field">
              <label for="patientEmail" data-portal="emailLabel"></label>
              <input id="patientEmail" name="email" type="email" autocomplete="username" required>
            </div>

            <div class="form-field">
              <label for="patientPassword" data-portal="passwordLabel"></label>
              <input id="patientPassword" name="password" type="password" autocomplete="current-password" required>
            </div>

            <button class="button button-dark form-submit" type="submit" data-portal="loginSubmitButton"></button>
            <p class="form-message" id="loginMessage" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>

    <section class="section contact-section" id="contact">
      <div class="container contact-heading">
        <p class="section-label" data-contact="title"></p>
        <h2 data-contact="description"></h2>
      </div>

      <div class="container contact-grid">
        <div class="contact-card">
          <span class="contact-card-icon">☎</span>
          <h3 data-contact="phoneLabel"></h3>
          <a id="contactPhone" href="#"></a>
        </div>

        <div class="contact-card">
          <span class="contact-card-icon">◉</span>
          <h3 data-contact="whatsappLabel"></h3>
          <a id="contactWhatsapp" href="#" target="_blank" rel="noopener noreferrer"></a>
        </div>

        <div class="contact-card">
          <span class="contact-card-icon">⌖</span>
          <h3 data-contact="addressLabel"></h3>
          <p id="contactAddress"></p>
        </div>

        <div class="contact-card hours-card">
          <span class="contact-card-icon">◷</span>
          <h3 data-contact="hoursLabel"></h3>
          <ul id="workingHours"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-top">
      <a class="brand footer-brand" href="#home">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span class="brand-text">
          <strong data-doctor-name></strong>
          <small data-specialty></small>
        </span>
      </a>

      <p data-footer="disclaimer"></p>
    </div>

    <div class="container footer-bottom">
      <span id="copyrightText"></span>
      <a href="#home" data-footer="madeFor"></a>
    </div>
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
